<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAKİNA BAKIM TAKİP SİSTEMİ</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<!-- Firebase SDK v10 (Compat Mode) -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<style>
:root{--bg:#0a0c0f;--surface:#111318;--surface2:#181c24;--border:#1e2430;--accent:#f0a500;--text:#d4dbe8;--text-dim:#5a6478;--text-muted:#2e3545;--green:#00c97a;--red:#ff4444;--blue:#2e9cff;--orange:#ff8c00;--purple:#9b59ff;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:"IBM Plex Sans",sans-serif;min-height:100vh;}
#login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:32px;z-index:1000;}
.logo{font-family:"Bebas Neue",sans-serif;font-size:48px;letter-spacing:6px;color:var(--accent);text-align:center;}
.logo span{color:var(--text-dim);font-size:13px;font-family:"IBM Plex Mono",monospace;display:block;letter-spacing:4px;margin-top:6px;}
.lbox{background:var(--surface);border:1px solid var(--border);border-top:2px solid var(--accent);padding:32px;width:320px;}
.lbox h2{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:3px;color:var(--text-dim);margin-bottom:20px;}
.lf{margin-bottom:14px;}
.lf label{display:block;font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:2px;color:var(--text-dim);margin-bottom:5px;text-transform:uppercase;}
.lf input{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:10px 12px;font-family:"IBM Plex Mono",monospace;font-size:13px;outline:none;}
.lf input:focus{border-color:var(--accent);}
.lbtn{width:100%;background:var(--accent);color:#000;border:none;padding:12px;font-family:"Bebas Neue",sans-serif;font-size:18px;letter-spacing:4px;cursor:pointer;margin-top:6px;}
.lerr{color:var(--red);font-family:"IBM Plex Mono",monospace;font-size:11px;margin-top:8px;display:none;}
#app{display:none;}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);min-height:52px;display:flex;align-items:center;padding:8px 16px;gap:12px;position:sticky;top:0;z-index:100;flex-wrap:wrap;}
.tlogo{font-family:"Bebas Neue",sans-serif;font-size:20px;letter-spacing:4px;color:var(--accent);}
.tdiv{width:1px;height:24px;background:var(--border);}
.ntabs{display:flex;gap:2px;flex-wrap:wrap;}
.ntab{padding:5px 11px;font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:1px;cursor:pointer;border:1px solid transparent;color:var(--text-dim);background:none;text-transform:uppercase;}
.ntab.active{color:var(--accent);border-color:var(--accent);background:rgba(240,165,0,0.07);}
.tuser{margin-left:auto;display:flex;align-items:center;gap:8px;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--text-dim);}
.ubdg{padding:2px 8px;font-size:9px;letter-spacing:1px;}
.badmin{background:rgba(240,165,0,0.15);color:var(--accent);border:1px solid var(--accent);}
.bview{background:rgba(46,156,255,0.1);color:var(--blue);border:1px solid var(--blue);}
.beditor{background:rgba(0,201,122,0.1);color:var(--green);border:1px solid var(--green);}
.obtn{background:none;border:1px solid var(--border);color:var(--text-dim);padding:3px 8px;font-family:"IBM Plex Mono",monospace;font-size:9px;cursor:pointer;}
.mc{padding:20px;max-width:1440px;margin:0 auto;}
.ph{margin-bottom:20px;border-bottom:1px solid var(--border);padding-bottom:14px;display:flex;justify-content:space-between;align-items:flex-end;}
.pt{font-family:"Bebas Neue",sans-serif;font-size:34px;letter-spacing:4px;color:var(--text);}
.pt span{color:var(--accent);}
.ps{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--text-dim);letter-spacing:2px;margin-bottom:2px;}
.filters{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.srch{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:7px 12px;font-family:"IBM Plex Mono",monospace;font-size:12px;outline:none;flex:1;min-width:180px;}
.srch:focus{border-color:var(--accent);}
.fsel{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:7px 10px;font-family:"IBM Plex Mono",monospace;font-size:11px;outline:none;cursor:pointer;}
.machine-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:16px;}
.machine-card{background:var(--surface);border:1px solid var(--border);padding:16px;cursor:pointer;transition:all 0.2s;}
.machine-card:hover{border-color:var(--accent);background:var(--surface2);}
.machine-card h3{font-family:"Bebas Neue",sans-serif;font-size:16px;letter-spacing:2px;color:var(--accent);margin-bottom:8px;}
.machine-card p{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--text-dim);margin-bottom:4px;}
.machine-card .hours{font-family:"Bebas Neue",sans-serif;font-size:18px;color:var(--green);margin-top:8px;}
.vtable-wrap{overflow-x:auto;}
.vtable{width:100%;border-collapse:collapse;}
.vtable th{font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:2px;color:var(--text-dim);text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);text-transform:uppercase;background:var(--bg);white-space:nowrap;}
.vtable td{padding:9px 10px;border-bottom:1px solid var(--text-muted);font-family:"IBM Plex Mono",monospace;font-size:11px;white-space:nowrap;}
.vtable tr:hover td{background:var(--surface2);}
.vtable tr.row-urgent td{background:rgba(255,68,68,0.04);}
.vtable tr.row-warn td{background:rgba(255,140,0,0.04);}
.td-r{text-align:right;}.td-acc{color:var(--accent);font-weight:600;}.td-grn{color:var(--green);}.td-red{color:var(--red);}.td-ora{color:var(--orange);}.td-blue{color:var(--blue);}.td-dim{color:var(--text-dim);}
.badge{display:inline-block;padding:2px 6px;font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:1px;text-transform:uppercase;border:1px solid;}
.badge-ok{color:var(--green);border-color:var(--green);background:rgba(0,201,122,0.08);}
.badge-warn{color:var(--orange);border-color:var(--orange);background:rgba(255,140,0,0.08);}
.badge-urgent{color:var(--red);border-color:var(--red);background:rgba(255,68,68,0.08);}
.detail-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:500;display:none;align-items:flex-start;justify-content:center;padding:16px;overflow-y:auto;}
.detail-overlay.show{display:flex;}
.detail-box{background:var(--surface);border:1px solid var(--border);border-top:3px solid var(--accent);width:100%;max-width:900px;margin:auto;}
.detail-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);}
.detail-title{font-family:"Bebas Neue",sans-serif;font-size:22px;letter-spacing:3px;color:var(--accent);}
.detail-sub{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--text-dim);margin-top:2px;}
.close-btn{background:none;border:1px solid var(--border);color:var(--text-dim);padding:5px 10px;font-family:"IBM Plex Mono",monospace;font-size:10px;cursor:pointer;}
.detail-body{padding:16px 20px;}
.dtabs{display:flex;gap:3px;margin-bottom:16px;border-bottom:1px solid var(--border);flex-wrap:wrap;}
.dtab{padding:7px 14px;font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:2px;cursor:pointer;border:1px solid transparent;color:var(--text-dim);background:none;text-transform:uppercase;border-bottom:none;margin-bottom:-1px;}
.dtab.active{color:var(--accent);border-color:var(--border);border-bottom-color:var(--surface);background:var(--surface);}
.dpanel{display:none;}.dpanel.active{display:block;}
.cari-sec{margin-bottom:16px;}
.cari-title{font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:3px;color:var(--text-dim);text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:8px;}
.cari-title::after{content:"";flex:1;height:1px;background:var(--border);}
.ctable{width:100%;border-collapse:collapse;}
.ctable th{font-family:"IBM Plex Mono",monospace;font-size:9px;color:var(--text-dim);text-align:left;padding:6px 8px;border-bottom:1px solid var(--border);text-transform:uppercase;background:var(--bg);}
.ctable td{padding:8px;border-bottom:1px solid var(--text-muted);font-family:"IBM Plex Mono",monospace;font-size:11px;}
.ctable tr:hover td{background:var(--surface2);}
.ctable .edit-btn{background:none;border:1px solid var(--border);color:var(--accent);padding:2px 6px;font-family:"IBM Plex Mono",monospace;font-size:9px;cursor:pointer;}
.uf{background:var(--bg);border:1px solid var(--border);padding:14px;margin-bottom:14px;}
.uf h4{font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:3px;color:var(--accent);text-transform:uppercase;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border);}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.fi label{display:block;font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:2px;color:var(--text-dim);text-transform:uppercase;margin-bottom:4px;}
.fi input{width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:8px 10px;font-family:"IBM Plex Mono",monospace;font-size:12px;outline:none;color-scheme:dark;}
.fi input:focus{border-color:var(--accent);}
.fi input[readonly]{background:var(--surface2);color:var(--text-dim);}
.upbtn{background:var(--accent);color:#000;border:none;padding:9px 20px;font-family:"Bebas Neue",sans-serif;font-size:15px;letter-spacing:3px;cursor:pointer;margin-right:8px;}
.upbtn:hover{opacity:0.9;}
.cbtn{background:none;border:1px solid var(--border);color:var(--text-dim);padding:9px 20px;font-family:"Bebas Neue",sans-serif;font-size:15px;letter-spacing:3px;cursor:pointer;}
.prog-wrap{margin-bottom:14px;}
.prog-label{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--text-dim);margin-bottom:4px;display:flex;justify-content:space-between;}
.prog-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;}
.prog-fill{height:100%;border-radius:3px;}
.status-urgent{background:var(--red);}
.status-warn{background:var(--orange);}
.status-ok{background:var(--green);}
.notbox{background:rgba(240,165,0,0.08);border:1px solid rgba(240,165,0,0.3);padding:10px 12px;margin-top:8px;}
.notbox p{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--accent);line-height:1.6;}
.loading{text-align:center;padding:20px;color:var(--text-dim);}
.spinner{display:inline-block;width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

</head>
<body>

<!-- LOGIN SCREEN -->
<div id="login">
<div class="logo">MAKİNA BAKIM<span>FIREBASE TAKIP SİSTEMİ</span></div>
<div class="lbox">
<h2>GİRİŞ YAP</h2>
<div class="lf">
<label>E-MAİL</label>
<input type="email" id="loginEmail" placeholder="ornek@example.com">
</div>
<div class="lf">
<label>ŞİFRE</label>
<input type="password" id="loginPassword" placeholder="••••••••">
</div>
<button class="lbtn" onclick="handleLogin()">GİRİŞ</button>
<div class="lerr" id="loginError"></div>
<p style="text-align:center;margin-top:16px;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--text-dim);">
Hesabınız yok mu? <a href="#" onclick="toggleSignup()" style="color:var(--accent);text-decoration:none;">KAYIT OL</a>
</p>
</div>
</div>

<!-- MAIN APP -->
<div id="app">
<div class="topbar">
<div class="tlogo">MAKİNA BAKIM</div>
<div class="tdiv"></div>
<div class="ntabs">
<button class="ntab active" onclick="switchTab('machines')">MAKİNALAR</button>
<button class="ntab" onclick="switchTab('maintenance')">BAKIM TAKİBİ</button>
</div>
<div class="tuser">
<span id="userEmail"></span>
<span class="ubdg beditor" id="userRole"></span>
<button class="obtn" onclick="handleLogout()">ÇIKIŞ</button>
</div>
</div>

<div class="mc">
<!-- MACHINES TAB -->
<div id="machinesTab" class="tab-content">
<div class="ph">
<div>
<div class="pt">MAKİNA <span>LİSTESİ</span></div>
<div class="ps">Tüm makinalar ve cari bakım durumları</div>
</div>
</div>

<div class="filters">
<input type="text" class="srch" id="machineSearch" placeholder="Makina adı veya kodu ara..." onkeyup="filterMachines()">
<select class="fsel" id="machineFilter" onchange="filterMachines()">
<option value="">TÜM MAKINALAR</option>
<option value="E">KAZICI (E)</option>
<option value="L">LODER (L)</option>
<option value="R">ROCK (R)</option>
<option value="G">GREYDER (G)</option>
<option value="S">SILINDIR (S)</option>
</select>
</div>

<div class="machine-grid" id="machineGrid">
<div class="loading"><div class="spinner"></div></div>
</div>
</div>

<!-- MAINTENANCE TAB -->
<div id="maintenanceTab" class="tab-content" style="display:none;">
<div class="ph">
<div>
<div class="pt">BAKIM <span>TAKİBİ</span></div>
<div class="ps">Bakım geçmişi ve planlanan bakımlar</div>
</div>
</div>

<div class="vtable-wrap">
<table class="vtable">
<thead>
<tr>
<th>MAKİNA</th>
<th>KOD</th>
<th>MOTOR SAATİ</th>
<th>MOTOR YAĞI</th>
<th>MOTOR FİLTRESİ</th>
<th>HİDROLİK YAĞI</th>
<th>DURUM</th>
</tr>
</thead>
<tbody id="maintenanceTableBody">
<tr><td colspan="7" class="loading"><div class="spinner"></div></td></tr>
</tbody>
</table>
</div>
</div>
</div>

</div>

<!-- DETAIL MODAL -->
<div id="detailOverlay" class="detail-overlay">
<div class="detail-box">
<div class="detail-header">
<div>
<div class="detail-title" id="detailTitle">MAKİNA</div>
<div class="detail-sub" id="detailSub"></div>
</div>
<button class="close-btn" onclick="closeDetail()">KAPAT</button>
</div>
<div class="detail-body">
<div class="dtabs">
<button class="dtab active" onclick="switchDetailTab('info')">BİLGİLER</button>
<button class="dtab" onclick="switchDetailTab('maintenance')">BAKIM CARİSİ</button>
<button class="dtab" onclick="switchDetailTab('history')">GEÇMİŞ</button>
</div>

<!-- INFO PANEL -->
<div id="infoPanel" class="dpanel active">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;">
<div>
<div style="font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--text-dim);text-transform:uppercase;margin-bottom:4px;">MAKİNA ADI</div>
<div style="font-family:'Bebas Neue',sans-serif;font-size:16px;color:var(--accent);" id="infoName"></div>
</div>
<div>
<div style="font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--text-dim);text-transform:uppercase;margin-bottom:4px;">KOD</div>
<div style="font-family:'Bebas Neue',sans-serif;font-size:16px;color:var(--text);" id="infoCode"></div>
</div>
<div>
<div style="font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--text-dim);text-transform:uppercase;margin-bottom:4px;">MODEL</div>
<div style="font-family:'Bebas Neue',sans-serif;font-size:14px;color:var(--text);" id="infoModel"></div>
</div>
<div>
<div style="font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--text-dim);text-transform:uppercase;margin-bottom:4px;">MOTOR SAATİ</div>
<div style="font-family:'Bebas Neue',sans-serif;font-size:16px;color:var(--green);" id="infoHours"></div>
</div>
</div>
</div>

<!-- MAINTENANCE PANEL -->
<div id="maintenancePanel" class="dpanel">
<div id="maintenanceContent"></div>
</div>

<!-- HISTORY PANEL -->
<div id="historyPanel" class="dpanel">
<div id="historyContent"></div>
</div>
</div>
</div>
</div>

// Authentication Functions
function handleLogin() {
const email = document.getElementById('loginEmail').value;
const password = document.getElementById('loginPassword').value;
const errorDiv = document.getElementById('loginError');

if (!email || !password) {
errorDiv.textContent = 'E-mail ve şifre gerekli';
errorDiv.style.display = 'block';
return;
}

auth.signInWithEmailAndPassword(email, password)
.then(userCredential => {
currentUser = userCredential.user;
showApp();
loadMachines();
})
.catch(error => {
errorDiv.textContent = error.message;
errorDiv.style.display = 'block';
});
}

function handleLogout() {
auth.signOut().then(() => {
currentUser = null;
currentMachine = null;
document.getElementById('login').style.display = 'flex';
document.getElementById('app').style.display = 'none';
});
}

function showApp() {
document.getElementById('login').style.display = 'none';
document.getElementById('app').style.display = 'block';
document.getElementById('userEmail').textContent = currentUser.email;
document.getElementById('userRole').textContent = 'EDITOR';
}

// Tab Navigation
function switchTab(tab) {
document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
document.getElementById(tab + 'Tab').style.display = 'block';
document.querySelectorAll('.ntab').forEach(el => el.classList.remove('active'));
event.target.classList.add('active');

if (tab === 'maintenance') {
loadMaintenanceTable();
}
}

function switchDetailTab(tab) {
document.querySelectorAll('.dpanel').forEach(el => el.classList.remove('active'));
document.getElementById(tab + 'Panel').classList.add('active');
document.querySelectorAll('.dtab').forEach(el => el.classList.remove('active'));
event.target.classList.add('active');

if (tab === 'maintenance') {
loadMaintenanceDetail();
} else if (tab === 'history') {
loadHistoryDetail();
}
}

// Load Machines
function loadMachines() {
const grid = document.getElementById('machineGrid');
grid.innerHTML = '';

machinesDatabase.forEach(machine => {
const card = document.createElement('div');
card.className = 'machine-card';
card.onclick = () => showMachineDetail(machine);

const remaining = machine.motorOil.nextHours - machine.hours;
let status = 'ok';
if (remaining < 0) status = 'urgent';
else if (remaining < 100) status = 'warn';

card.innerHTML = `
<h3>${machine.code}</h3>
<p>${machine.name}</p>
<p style="color:var(--text-dim);">${machine.model}</p>
<div class="hours">${machine.hours.toLocaleString('tr-TR')} SAATİ</div>
<div style="margin-top:8px;font-size:10px;color:var(--${status === 'urgent' ? 'red' : status === 'warn' ? 'orange' : 'green'});">
Motor Yağı: ${remaining > 0 ? remaining + ' saat kaldı' : 'YAKIN'}
</div>
`;
grid.appendChild(card);
});
}

function filterMachines() {
const search = document.getElementById('machineSearch').value.toLowerCase();
const filter = document.getElementById('machineFilter').value;

const cards = document.querySelectorAll('.machine-card');
cards.forEach(card => {
const text = card.textContent.toLowerCase();
const code = card.querySelector('h3').textContent;
const matches = text.includes(search) && (!filter || code.startsWith(filter));
card.style.display = matches ? 'block' : 'none';
});
}

// Machine Detail
function showMachineDetail(machine) {
currentMachine = machine;
document.getElementById('detailTitle').textContent = machine.code;
document.getElementById('detailSub').textContent = machine.name;
document.getElementById('infoName').textContent = machine.name;
document.getElementById('infoCode').textContent = machine.code;
document.getElementById('infoModel').textContent = machine.model;
document.getElementById('infoHours').textContent = machine.hours.toLocaleString('tr-TR');

loadMaintenanceDetail();
document.getElementById('detailOverlay').classList.add('show');
}

function closeDetail() {
document.getElementById('detailOverlay').classList.remove('show');
currentMachine = null;
}

function loadMaintenanceDetail() {
if (!currentMachine) return;

const content = document.getElementById('maintenanceContent');
content.innerHTML = '';

const items = [
{label: 'Motor Yağı', key: 'motorOil', icon: '🛢️'},
{label: 'Motor Filtresi', key: 'motorFilter', icon: '🔧'},
{label: 'Yakıt Filtresi', key: 'fuelFilter', icon: '⛽'},
{label: 'Hidrolik Yağı', key: 'hydraulicOil', icon: '💧'},
];

items.forEach(item => {
const data = currentMachine[item.key];
if (!data) return;

const remaining = data.nextHours - currentMachine.hours;
let statusClass = 'status-ok';
if (remaining < 0) statusClass = 'status-urgent';
else if (remaining < 100) statusClass = 'status-warn';

const section = document.createElement('div');
section.className = 'cari-sec';
section.innerHTML = `
<div class="cari-title">${item.icon} ${item.label}</div>
<table class="ctable">
<tr>
<td><strong>Son Değişim Tarihi:</strong></td>
<td>${data.lastDate || '-'}</td>
</tr>
<tr>
<td><strong>Değişim Saati:</strong></td>
<td>${data.lastHours.toLocaleString('tr-TR')} saat</td>
</tr>
<tr>
<td><strong>Sonraki Değişim:</strong></td>
<td>${data.nextHours.toLocaleString('tr-TR')} saat</td>
</tr>
<tr>
<td><strong>Aralık:</strong></td>
<td>${data.interval} saat</td>
</tr>
<tr>
<td><strong>Kalan:</strong></td>
<td style="color:${remaining < 0 ? 'var(--red)' : remaining < 100 ? 'var(--orange)' : 'var(--green)'};">${remaining > 0 ? remaining + ' saat' : 'YAKIN'}</td>
</tr>
</table>
<div class="prog-wrap">
<div class="prog-label">
<span>İlerleme</span>
<span>${Math.min(100, Math.max(0, ((currentMachine.hours - data.lastHours) / data.interval * 100).toFixed(0)))}%</span>
</div>
<div class="prog-bar">
<div class="prog-fill ${statusClass}" style="width:${Math.min(100, Math.max(0, ((currentMachine.hours - data.lastHours) / data.interval * 100).toFixed(0)))}%"></div>
</div>
</div>
<button class="edit-btn" onclick="editMaintenance('${item.key}')">GÜNCELLE</button>
`;
content.appendChild(section);
});
}

function editMaintenance(key) {
const data = currentMachine[key];
const newDate = prompt('Değişim Tarihi (YYYY-MM-DD):', data.lastDate || '');
if (!newDate) return;

const newHours = prompt('Bakım Yapılan Saat:', data.lastHours);
if (!newHours) return;

const hoursNum = parseInt(newHours);
currentMachine[key].lastDate = newDate;
currentMachine[key].lastHours = hoursNum;
currentMachine[key].nextHours = hoursNum + data.interval;

// Firebase'e kaydet
if (currentUser) {
db.collection('machines').doc(currentMachine.code).set({
...currentMachine,
lastUpdated: new Date()
}).then(() => {
alert('Bakım bilgisi güncellendi!');
loadMaintenanceDetail();
loadMachines();
}).catch(error => console.error('Hata:', error));
}
}

function loadHistoryDetail() {
const content = document.getElementById('historyContent');
content.innerHTML = `
<div style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-dim);padding:16px;text-align:center;">
Bakım geçmişi henüz kaydedilmemiş
</div>
`;
}

function loadMaintenanceTable() {
const tbody = document.getElementById('maintenanceTableBody');
tbody.innerHTML = '';

machinesDatabase.forEach(machine => {
const motorOilRemaining = machine.motorOil.nextHours - machine.hours;
const motorFilterRemaining = machine.motorFilter.nextHours - machine.hours;
const hydraulicRemaining = machine.hydraulicOil.nextHours - machine.hours;

let status = 'ok';
if (motorOilRemaining < 0 || motorFilterRemaining < 0 || hydraulicRemaining < 0) status = 'urgent';
else if (motorOilRemaining < 100 || motorFilterRemaining < 100 || hydraulicRemaining < 100) status = 'warn';

const row = document.createElement('tr');
row.className = `row-${status}`;
row.innerHTML = `
<td>${machine.name}</td>
<td class="td-acc">${machine.code}</td>
<td class="td-r">${machine.hours.toLocaleString('tr-TR')}</td>
<td class="td-r">${motorOilRemaining > 0 ? motorOilRemaining : 'YAKIN'}</td>
<td class="td-r">${motorFilterRemaining > 0 ? motorFilterRemaining : 'YAKIN'}</td>
<td class="td-r">${hydraulicRemaining > 0 ? hydraulicRemaining : 'YAKIN'}</td>
<td><span class="badge badge-${status}">${status === 'urgent' ? 'ACİL' : status === 'warn' ? 'UYARI' : 'TAMAM'}</span></td>
`;
tbody.appendChild(row);
});
}

// Auth State Listener
auth.onAuthStateChanged(user => {
if (user) {
currentUser = user;
showApp();
loadMachines();
} else {
document.getElementById('login').style.display = 'flex';
document.getElementById('app').style.display = 'none';
}
});

// Initial Load
loadMachines();
</script>
